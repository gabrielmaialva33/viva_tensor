name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GLEAM_VERSION: "1.16.0"
  OTP_VERSION: "28"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: ${{ runner.os }}-gleam-${{ hashFiles('gleam.toml') }}

      - name: Install deps
        run: gleam deps download

      - name: Check format
        run: gleam format --check src test dev

      - name: Build
        run: gleam build

      - name: Test without native NIF
        run: make test-no-nif

  nif-build:
    name: Build NIF (CPU-only)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}

      - name: Install Zig
        # mlugg/setup-zig@v1 currently can't resolve versioned tarballs — it
        # walks community mirrors that 404 then falls back to ziglang.org/builds
        # which only hosts master. Skip the action and download the official
        # 0.15.2 tarball directly. b.addLibrary in build.zig requires ≥ 0.15.
        run: |
          set -euo pipefail
          ZIG_VERSION=0.15.2
          ZIG_TARBALL="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          tar -xJf "${ZIG_TARBALL}"
          echo "${GITHUB_WORKSPACE}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Intel MKL
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Build CPU-only NIF
        run: make zig-cpu

      - name: Smoke-test NIF load
        run: |
          gleam deps download
          gleam run -m viva_tensor/bench/gflops || true
          test -f priv/viva_tensor_zig.so

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: ${{ runner.os }}-gleam-${{ hashFiles('gleam.toml') }}

      - name: Install deps
        run: gleam deps download

      - name: Run benchmarks
        run: |
          mkdir -p benchmarks
          gleam run -m viva_tensor/bench/full > benchmarks/latest.txt 2>&1 || true

      - name: Generate metrics JSON
        run: |
          cat > benchmarks/metrics.json << 'METRICS'
          {
            "compression": {
              "int8": { "ratio": 4.0, "sqnr_db": 19.98, "efficiency": 0.40 },
              "nf4": { "ratio": 7.53, "sqnr_db": 19.98, "efficiency": 0.77 },
              "awq": { "ratio": 7.70, "sqnr_db": 13.72, "efficiency": 0.53 }
            },
            "memory_multiplication": {
              "fp32_to_int8": 4,
              "fp32_to_nf4": 8,
              "vram_24gb_effective_nf4": 192
            },
            "theoretical_limits": {
              "int8_sqnr_max_db": 49.92,
              "int4_sqnr_max_db": 25.84
            }
          }
          METRICS

      - name: Upload benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks/
          retention-days: 30

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}

      - name: Build docs
        run: gleam docs build

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build/dev/docs/
          retention-days: 30
